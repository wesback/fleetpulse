---
# Example Docker Compose configuration using PostgreSQL
# Usage: docker compose -f docker-compose.postgres.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: fleetpulse-postgres
    environment:
      - POSTGRES_DB=fleetpulse
      - POSTGRES_USER=fleetpulse
      - POSTGRES_PASSWORD=fleetpulse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - fleetpulse
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: fleetpulse-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      # Database configuration - PostgreSQL
      - DATABASE_TYPE=postgresql
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=fleetpulse
      - POSTGRES_USER=fleetpulse
      - POSTGRES_PASSWORD=fleetpulse
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-uvicorn}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      # OpenTelemetry configuration
      - OTEL_SERVICE_NAME=fleetpulse-backend
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_ENVIRONMENT=${OTEL_ENVIRONMENT:-development}
      - OTEL_ENABLE_TELEMETRY=${OTEL_ENABLE_TELEMETRY:-true}
      - OTEL_EXPORTER_TYPE=${OTEL_EXPORTER_TYPE:-jaeger}
      - OTEL_EXPORTER_JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_TRACE_SAMPLE_RATE=${OTEL_TRACE_SAMPLE_RATE:-1.0}
      - JAEGER_AGENT_HOST=jaeger
      - JAEGER_AGENT_PORT=6831
    networks:
      - fleetpulse
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      otel-collector:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fleetpulse-frontend
    ports:
      - "8080:80"
    restart: unless-stopped
    environment:
      - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL:-/api}
    depends_on:
      - backend
    networks:
      - fleetpulse

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: fleetpulse-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    restart: unless-stopped
    networks:
      - fleetpulse

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: fleetpulse-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"
    depends_on:
      - jaeger
    restart: unless-stopped
    networks:
      - fleetpulse

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
      args:
        USER_ID: ${USER_ID:-1000}
        GROUP_ID: ${GROUP_ID:-1000}
    container_name: fleetpulse-mcp
    ports:
      - "8001:8001"
    restart: unless-stopped
    environment:
      - FLEETPULSE_API_URL=http://backend:8000
      - MCP_PORT=8001
      - REQUEST_TIMEOUT=${REQUEST_TIMEOUT:-30.0}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - OTEL_SERVICE_NAME=fleetpulse-mcp
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_ENVIRONMENT=${OTEL_ENVIRONMENT:-development}
      - OTEL_ENABLE_TELEMETRY=${OTEL_ENABLE_TELEMETRY:-true}
      - OTEL_EXPORTER_TYPE=${OTEL_EXPORTER_TYPE:-jaeger}
      - OTEL_EXPORTER_JAEGER_ENDPOINT=http://jaeger:14268/api/traces
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_TRACE_SAMPLE_RATE=${OTEL_TRACE_SAMPLE_RATE:-1.0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fleetpulse
    depends_on:
      - backend
      - jaeger
      - otel-collector

networks:
  fleetpulse:
    driver: bridge

volumes:
  postgres-data:
